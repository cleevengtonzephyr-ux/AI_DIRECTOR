name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-preflight:
    name: Dependency install (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            python-version: "3.14.5"
          - os: ubuntu-24.04
            python-version: "3.14.4"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.13.1

      - name: Install locked approval-service dependencies
        run: uv sync --locked --no-dev --project approval_service

  tests:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.5"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.13.1

      - name: Unit tests
        run: uv run --locked --no-dev --project approval_service python -m unittest discover -s tests -t . -v

      - name: Architecture audit (NO_DRIFT)
        run: python scripts/architecture_audit.py
