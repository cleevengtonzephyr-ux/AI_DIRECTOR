name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-preflight:
    name: Dependency install (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            python-version: "3.14.5"
          - os: ubuntu-24.04
            python-version: "3.14.4"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.13.1

      - name: Install locked approval-service dependencies
        run: uv sync --locked --no-dev --project approval_service

  # Branche POSIX de la réservation d'exécution (fcntl.flock), que le job
  # Windows `tests` n'exerce jamais. Bibliothèque standard uniquement.
  posix-execution-claim:
    name: Execution claim tests (ubuntu-24.04, Python 3.14.4)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.4"

      - name: Execution claim tests (POSIX)
        run: python -m unittest tests.test_g2_atomic_execution_claim -v

  # Registre d'approbation G2 (SQLite) sous POSIX : verrous fcntl, mémoire
  # partagée WAL et permissions, que le job Windows `tests` n'exerce jamais.
  # Dépendances verrouillées installées avec empreintes dans le Python système.
  posix-approval-store:
    name: Approval store tests (ubuntu-24.04, Python 3.14.4)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.4"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.13.1

      - name: Install locked approval-service dependencies into system Python
        run: |
          uv export --locked --no-dev --no-emit-project --project approval_service --format requirements.txt --output-file "$RUNNER_TEMP/approval-requirements.txt"
          python -m pip install --disable-pip-version-check --require-hashes --no-deps -r "$RUNNER_TEMP/approval-requirements.txt"

      - name: Approval store tests (POSIX)
        run: python -m unittest tests.test_g2_approval_store -v

  tests:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.5"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.13.1

      # Les tests restent sur l'interpréteur système de setup-python : un
      # python.exe de venv uv, copié ailleurs (faux node.exe des tests P2.1),
      # échoue avec le code 106 faute de pyvenv.cfg.
      - name: Install locked approval-service dependencies into system Python
        shell: pwsh
        run: |
          uv export --locked --no-dev --no-emit-project --project approval_service --format requirements.txt --output-file "$env:RUNNER_TEMP/approval-requirements.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --disable-pip-version-check --require-hashes --no-deps -r "$env:RUNNER_TEMP/approval-requirements.txt"
          exit $LASTEXITCODE

      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v

      - name: Architecture audit (NO_DRIFT)
        run: python scripts/architecture_audit.py
